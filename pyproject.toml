[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jafar"
version = "3.0.0"
description = "The villain to BlackRock's Aladdin. Twitter/X market sentiment analysis for people who can't afford $25k/month."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "twscrape",
    "spacy",
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "google-genai",
    "python-dotenv",
    "pyyaml",
    "aiohttp",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "yfinance",
    "ddgs",
    "python-dateutil>=2.9.0.post0",
    "scikit-learn",
]

[project.scripts]
jafar = "src.main:main"

[dependency-groups]
dev = [
    "pylint",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-cov",
    "pytest-timeout",
    "freezegun",
    "aiosqlite",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]
timeout = 60

[tool.coverage.run]
source = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
twscrape = { git = "https://github.com/Telesphoreo/twscrape.git" }
