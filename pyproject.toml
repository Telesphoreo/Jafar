[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jafar"
version = "3.0.0"
description = "The villain to BlackRock's Aladdin. Twitter/X market sentiment analysis for people who can't afford $25k/month."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.5",
    "asyncpg>=0.31.0",
    "ddgs>=9.14.2",
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "flask>=3.1.3",
    "google-genai>=2.0.1",
    "gunicorn>=26.0.0",
    "httpx[socks]>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "spacy>=3.8.14",
    "sqlalchemy[asyncio]>=2.0.49",
    "twscrape",
    "yfinance>=1.3.0",
]

[project.scripts]
jafar = "src.main:main"
dashboard = "src.dashboard.app:main"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "freezegun>=1.5.5",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]
timeout = 60

[tool.coverage.run]
source = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
twscrape = { git = "https://github.com/Telesphoreo/twscrape.git" }
